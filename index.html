<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test Login - No errors</title>
    <style>
        body { font-family: Arial; background: #f0f4f8; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-box { background: white; padding: 30px; border-radius: 20px; width: 350px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        input { display: block; width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; }
        button { background: #667eea; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; width: 100%; }
        .error { color: red; margin-top: 10px; display: none; }
        .main { display: none; text-align: center; margin-top: 20px; }
    </style>
</head>
<body>
<div id="loginScreen" class="login-box">
    <h2>Peter AI Login Test</h2>
    <input type="text" id="username" placeholder="Username" autocomplete="off">
    <input type="password" id="password" placeholder="Password">
    <button id="loginBtn">Login</button>
    <div id="errorMsg" class="error">Invalid credentials</div>
</div>

<div id="mainContent" class="main">
    <h2>✅ Login successful!</h2>
    <p>You are now logged in. The full application can be loaded here.</p>
    <button id="logoutBtn">Logout</button>
</div>

<script>
    // Hardcoded valid credentials
    const validUsers = {
        'WashingMachine$': 'wmiitk$',
        'admin': 'admin123'
    };

    const loginScreen = document.getElementById('loginScreen');
    const mainContent = document.getElementById('mainContent');
    const errorMsg = document.getElementById('errorMsg');

    document.getElementById('loginBtn').addEventListener('click', function() {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;

        if (validUsers[user] && validUsers[user] === pass) {
            loginScreen.style.display = 'none';
            mainContent.style.display = 'block';
            errorMsg.style.display = 'none';
        } else {
            errorMsg.style.display = 'block';
            setTimeout(() => { errorMsg.style.display = 'none'; }, 2000);
        }
    });

    document.getElementById('logoutBtn').addEventListener('click', function() {
        loginScreen.style.display = 'block';
        mainContent.style.display = 'none';
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';
    });
</script>
</body>
</html>
